appId: com.onesoft.erp
productName: OneSoft ERP
artifactName: OneSoftSetup-${version}.${ext}
copyright: Copyright © 2026 OneSoft

extraMetadata:
  version: "1.0.0"

directories:
  output: release
  buildResources: resources

files:
  - dist-electron/**/*
  - dist-ui/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/.bin"
  - "!node_modules/.cache"
  - "!node_modules/.pnpm"
  - "!node_modules/.modules.yaml"
  - "!node_modules/.package-lock.json"
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/typescript/**"
  - "!node_modules/vite/**"
  - "!node_modules/@vitejs/**"
  - "!node_modules/tsx/**"
  - "!node_modules/concurrently/**"
  - "!node_modules/wait-on/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/@types/**"
  - "!node_modules/rollup/**"
  - "!node_modules/esbuild/**"
  - "!node_modules/@esbuild/**"

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/serve-client.js
    to: serve-client.js
  - from: resources/app
    to: app
    filter:
      - "**/*"
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: OneSoft ERP
  menuCategory: OneSoft
  language: "1025"
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  license: resources/LICENSE.txt
  uninstallDisplayName: OneSoft ERP
  deleteAppDataOnUninstall: false

publish: ~
