appId: com.onesoft.erp
productName: OneSoft ERP
artifactName: OneSoftSetup-${version}.${ext}
copyright: Copyright © 2026 OneSoft

extraMetadata:
  version: "1.0.0"

directories:
  output: release
  buildResources: resources

# Architecture:
#   dist-electron/electron/main.js   = esbuild bundle (pg + all JS deps inlined)
#   dist-electron/electron/preload.js = esbuild bundle
#   node_modules/node-windows         = auto-collected (only prod dep in package.json)
#
# electron-builder.collectNodeModules reads package.json "dependencies"
# (only node-windows) and follows that dep tree — pg/pg-types/obuf etc.
# are devDependencies and are NOT collected. esbuild bundle is the sole
# source for all JS packages.
files:
  - dist-electron/**/*
  - dist-ui/**/*
  - package.json

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/serve-client.js
    to: serve-client.js
  - from: resources/app
    to: app
    filter:
      - "**/*"
      - "!**/node_modules/**"
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: false
  shortcutName: OneSoft ERP
  menuCategory: OneSoft
  language: "1025"
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  license: resources/LICENSE.txt
  uninstallDisplayName: OneSoft ERP
  deleteAppDataOnUninstall: false

publish: ~
