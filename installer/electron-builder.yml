appId: com.onesoft.erp
productName: OneSoft ERP
artifactName: OneSoftSetup-${version}-${arch}.${ext}
copyright: Copyright © 2026 OneSoft

extraMetadata:
  version: "1.0.29"

directories:
  output: release
  buildResources: resources

# Architecture:
#   dist-electron/electron/main.js   = esbuild bundle (pg + all JS deps inlined)
#   dist-electron/electron/preload.js = esbuild bundle
#   node_modules/node-windows         = auto-collected (only prod dep in package.json)
#
# electron-builder.collectNodeModules reads package.json "dependencies"
# (only node-windows) and follows that dep tree — pg/pg-types/obuf etc.
# are devDependencies and are NOT collected. esbuild bundle is the sole
# source for all JS packages.
files:
  - dist-electron/**/*
  - dist-ui/**/*
  - package.json

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/serve-client.js
    to: serve-client.js
  - from: resources/app
    to: app
    filter:
      - "**/*"
      - "!**/node_modules/**"
      - "!**/drizzle/**"
      - "!**/server-app/src/foundation-data.json"
  # نسخ drizzle مباشرةً من السورس لضمان تضمينها حتى لو استُثنيت بـ .gitignore
  - from: ../server-app/drizzle
    to: app/server-app/drizzle
    filter:
      - "**/*"
  # نسخ قالب التأسيس — foundation-data.json مُدرَج دائماً مع المثبّت
  # المسار في وقت التشغيل: {resourcesPath}/app/server-app/src/foundation-data.json
  # ملاحظة: الملف مطلوب — تأكد من تصديره قبل بناء الإصدار
  - from: ../server-app/src/foundation-data.json
    to: app/server-app/src/foundation-data.json
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  icon: resources/icon.ico
  requestedExecutionLevel: requireAdministrator
  verifyUpdateCodeSignature: false

nsis:
  include: resources/installer.nsh
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OneSoft ERP
  menuCategory: OneSoft
  language: "1025"
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  license: resources/LICENSE.txt
  uninstallDisplayName: OneSoft ERP
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: nousirwork-dotcom
  repo: ONESOFT-ERP-CLEAN
  releaseType: release
  # للريبوات الخاصة: عيّن GH_TOKEN كـ env variable على جهاز البناء
  # للريبوات العامة: لا حاجة لتوكن
