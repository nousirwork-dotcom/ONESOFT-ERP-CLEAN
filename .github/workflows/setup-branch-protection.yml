name: Setup Branch Protection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/setup-branch-protection.yml

jobs:
  protect-main:
    name: Require FK check on main
    runs-on: ubuntu-latest
    steps:
      - name: Add FK check as required status check (safe read-modify-write)
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          REQUIRED_CONTEXT: "FK Constraint Check / Static FK delete-rule check"
        run: |
          set -euo pipefail

          API="https://api.github.com/repos/$OWNER/$REPO/branches/main/protection"
          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"

          echo "Step 1: Reading current branch protection for main..."
          GET_STATUS=$(curl -s -o /tmp/current_protection.json -w "%{http_code}" \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$VERSION_HEADER" "$API")

          echo "GET status: $GET_STATUS"

          if [ "$GET_STATUS" -eq 404 ]; then
            echo "No existing branch protection found. Creating minimal protection with FK check..."
            BODY=$(cat <<'JSON'
          {
            "required_status_checks": {
              "strict": false,
              "contexts": ["FK Constraint Check / Static FK delete-rule check"]
            },
            "enforce_admins": null,
            "required_pull_request_reviews": null,
            "restrictions": null
          }
          JSON
            )

          elif [ "$GET_STATUS" -eq 200 ]; then
            echo "Existing branch protection found. Merging FK check into existing settings..."

            # Check if context is already present
            ALREADY_SET=$(jq -r --arg ctx "$REQUIRED_CONTEXT" \
              '.required_status_checks.contexts // [] | map(select(. == $ctx)) | length' \
              /tmp/current_protection.json)

            if [ "$ALREADY_SET" -gt "0" ]; then
              echo "Required status check '$REQUIRED_CONTEXT' is already configured. Nothing to do."
              exit 0
            fi

            # Build a safe merged payload:
            # - Preserve existing required_status_checks (strict flag + existing contexts)
            # - Append the FK context
            # - Preserve enforce_admins, required_pull_request_reviews, restrictions as-is
            BODY=$(jq \
              --arg ctx "$REQUIRED_CONTEXT" \
              '{
                required_status_checks: {
                  strict: (.required_status_checks.strict // false),
                  contexts: ((.required_status_checks.contexts // []) + [$ctx] | unique)
                },
                enforce_admins: (if .enforce_admins.enabled then true else null end),
                required_pull_request_reviews: (
                  if .required_pull_request_reviews then {
                    dismiss_stale_reviews: .required_pull_request_reviews.dismiss_stale_reviews,
                    require_code_owner_reviews: .required_pull_request_reviews.require_code_owner_reviews,
                    required_approving_review_count: .required_pull_request_reviews.required_approving_review_count,
                    dismissal_restrictions: (if .required_pull_request_reviews.dismissal_restrictions then {
                      users: [.required_pull_request_reviews.dismissal_restrictions.users[].login],
                      teams: [.required_pull_request_reviews.dismissal_restrictions.teams[].slug]
                    } else null end)
                  } else null end
                ),
                restrictions: (
                  if .restrictions then {
                    users: [.restrictions.users[].login],
                    teams: [.restrictions.teams[].slug],
                    apps: ([.restrictions.apps[].slug] // [])
                  } else null end
                )
              }' /tmp/current_protection.json)

          elif [ "$GET_STATUS" -eq 403 ]; then
            echo "ERROR: GitHub API returned 403."
            echo "Branch protection rules require GitHub Pro for private repositories."
            echo ""
            echo "To configure manually:"
            echo "  Settings -> Branches -> Add branch protection rule -> main"
            echo "  Tick 'Require status checks to pass before merging' and add:"
            echo "  '$REQUIRED_CONTEXT'"
            exit 1

          else
            echo "ERROR: Unexpected GET status $GET_STATUS"
            cat /tmp/current_protection.json
            exit 1
          fi

          echo "Step 2: Applying updated branch protection..."
          PUT_STATUS=$(echo "$BODY" | curl -s -o /tmp/bp_response.json -w "%{http_code}" \
            -X PUT \
            -H "$AUTH_HEADER" -H "$ACCEPT_HEADER" -H "$VERSION_HEADER" \
            -H "Content-Type: application/json" \
            -d @- "$API")

          cat /tmp/bp_response.json
          echo ""

          if [ "$PUT_STATUS" -eq 200 ]; then
            echo "Branch protection updated. '$REQUIRED_CONTEXT' is now a required status check on main."
          else
            echo "ERROR: PUT returned HTTP $PUT_STATUS"
            exit 1
          fi
