name: Tag Release (via Secure Pipeline)

# هذا الـ workflow لا يُنفِّذ أي بناء أو نشر مباشر.
# مسار النشر الوحيد المعتمد هو client-windows-release.yml الذي يتضمن:
#   • 21 فحص أمني على الـ bundle (verify:client-build)
#   • 10 فحوصات على الـ installer (verify:installer)
#   • Security Gate يمنع النشر عند أي فشل
#
# لنشر إصدار جديد:
#   Actions → client-windows-release.yml → Run workflow
#   → dry_run=false + tag=v1.x.x

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Use client-windows-release.yml for actual releases'
        required: false
        default: 'See client-windows-release.yml'

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Redirect to secure release pipeline
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "  ⚠️  This workflow does not publish releases."
          echo ""
          echo "  To create a release, use the secure gated pipeline:"
          echo "  → Actions → client-windows-release.yml"
          echo "  → Run workflow → dry_run=false + tag=v1.x.x"
          echo ""
          echo "  The secure pipeline runs 21 + 10 security checks"
          echo "  before publishing any installer to GitHub Releases."
          echo "══════════════════════════════════════════════════════"
