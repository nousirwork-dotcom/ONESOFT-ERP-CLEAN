name: Windows Acceptance — v1.0.0 to v1.0.39

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  acceptance:
    name: "Windows x64 — ${{ matrix.scenario }}"
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, stale-ledger]

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'

      - name: Install PostgreSQL 16
        shell: pwsh
        run: |
          choco install postgresql16 --yes --no-progress --params '/Password:OneSoftAcceptance2026 /Port:5432'
          $service = Get-Service -Name 'postgresql-x64-16' -ErrorAction SilentlyContinue
          if (-not $service) { throw 'PostgreSQL 16 service was not installed' }
          if ($service.Status -ne 'Running') { Start-Service $service.Name }

      - name: Install NSSM
        shell: pwsh
        run: |
          choco install nssm --yes --no-progress
          if (-not (Get-Command nssm.exe -ErrorAction SilentlyContinue)) { throw 'NSSM was not installed' }

      - name: Install project dependencies
        shell: bash
        run: |
          cd client-app && pnpm install --no-frozen-lockfile && cd ..
          cd server-app && pnpm install --no-frozen-lockfile && cd ..
          cd installer && pnpm install --no-frozen-lockfile && cd ..

      - name: Build client-app
        working-directory: client-app
        run: pnpm run build

      - name: Build current Windows installer
        shell: pwsh
        run: |
          pnpm --dir installer run build
          $tag = "${{ github.event.release.tag_name || 'v1.0.39' }}"
          $targetVersion = $tag -replace '^v', ''
          $exe = Join-Path $env:GITHUB_WORKSPACE "installer\release\OneSoftSetup-$targetVersion-x64.exe"
          if (-not (Test-Path $exe)) { throw "Expected test installer was not created: $exe" }
          Copy-Item $exe (Join-Path $env:RUNNER_TEMP "OneSoftSetup-$targetVersion-x64.exe") -Force

      - name: Run clean v1.0.0 to v1.0.39 acceptance
        if: matrix.scenario == 'clean'
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || 'v1.0.39' }}"
          $targetVersion = $tag -replace '^v', ''
          $schemaSource = Get-Content -Raw 'server-app/src/schema-version.ts'
          if ($schemaSource -notmatch "REQUIRED_SCHEMA_VERSION\s*=\s*'([^']+)'") { throw 'Could not resolve the canonical schema version' }
          $schemaVersion = $Matches[1]
          ./scripts/windows-v100-v1039-acceptance.ps1 `
            -NewVersion $targetVersion `
            -ExpectedSchemaVersion $schemaVersion `
            -NewInstallerPath "$env:RUNNER_TEMP\OneSoftSetup-$targetVersion-x64.exe"

      - name: Run stale-ledger v1.0.0 to v1.0.39 acceptance
        if: matrix.scenario == 'stale-ledger'
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name || 'v1.0.39' }}"
          $targetVersion = $tag -replace '^v', ''
          $schemaSource = Get-Content -Raw 'server-app/src/schema-version.ts'
          if ($schemaSource -notmatch "REQUIRED_SCHEMA_VERSION\s*=\s*'([^']+)'") { throw 'Could not resolve the canonical schema version' }
          $schemaVersion = $Matches[1]
          ./scripts/windows-v100-v1039-acceptance.ps1 `
            -NewVersion $targetVersion `
            -ExpectedSchemaVersion $schemaVersion `
            -NewInstallerPath "$env:RUNNER_TEMP\OneSoftSetup-$targetVersion-x64.exe" `
            -ReproduceStaleLedger

      - name: Upload complete Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-v100-v1039-${{ matrix.scenario }}
          path: windows-v100-v1039-${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 30