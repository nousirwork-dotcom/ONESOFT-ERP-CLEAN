name: FK Constraint Check

on:
  pull_request:
    branches:
      - "**"

jobs:
  check-fk-static:
    name: Static FK delete-rule check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup server-app dependencies
        uses: ./.github/actions/setup-server-app

      - name: Run static FK constraint check
        working-directory: server-app
        run: pnpm check-fk:static

  check-fk-db:
    name: Live DB FK delete-rule check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_fk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup server-app dependencies
        uses: ./.github/actions/setup-server-app

      - name: Apply schema to test database (drizzle-kit push)
        working-directory: server-app
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_fk_test
        run: pnpm exec drizzle-kit push --force

      - name: Run live DB FK constraint check
        working-directory: server-app
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_fk_test
        run: pnpm check-fk:db

  merge-gate:
    name: Merge gate — FK check required
    runs-on: ubuntu-latest
    needs:
      - check-fk-static
      - check-fk-db
    if: always()
    steps:
      - name: Block merge if any FK check failed
        run: |
          if [ "${{ needs.check-fk-static.result }}" != "success" ]; then
            echo "ERROR: Static FK constraint check did not pass (result: ${{ needs.check-fk-static.result }})."
            echo "All FK relationships must have explicit delete rules before this PR can be merged."
            exit 1
          fi
          if [ "${{ needs.check-fk-db.result }}" != "success" ]; then
            echo "ERROR: Live DB FK constraint check did not pass (result: ${{ needs.check-fk-db.result }})."
            echo "FK constraints that passed static analysis failed when applied to a real PostgreSQL instance."
            exit 1
          fi
          echo "Both FK constraint checks passed. Merge is allowed."
