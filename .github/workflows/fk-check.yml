name: FK Constraint Check

on:
  pull_request:
    branches:
      - "**"

jobs:
  check-fk-static:
    name: Static FK delete-rule check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: server-app
        run: pnpm install

      - name: Run static FK constraint check
        working-directory: server-app
        run: pnpm check-fk:static

  merge-gate:
    name: Merge gate — FK check required
    runs-on: ubuntu-latest
    needs: check-fk-static
    if: always()
    steps:
      - name: Block merge if FK check failed
        run: |
          if [ "${{ needs.check-fk-static.result }}" != "success" ]; then
            echo "ERROR: FK constraint check did not pass (result: ${{ needs.check-fk-static.result }})."
            echo "All FK relationships must have explicit delete rules before this PR can be merged."
            exit 1
          fi
          echo "FK constraint check passed. Merge is allowed."
