name: Client Windows Release — Security Verified

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline الإصدار الرسمي لنسخة العميل على Windows
#
# الخطوات بالترتيب:
#   Job 1 — security-precheck  (Ubuntu — سريع)
#     ✔ verify:client-build — 21 اختبار على source + bundle
#   Job 2 — build-windows  (Windows — يعتمد على نجاح Job 1)
#     ✔ بناء installer/resources بـ CLIENT_BUILD=true
#     ✔ بناء Electron installer x64 + ia32 (NSIS)
#     ✔ توليد latest.yml (x64) و latest-ia32.yml (ia32)
#     ✔ verify:installer على win-unpacked (x64)
#     ✔ رفع artifacts: كلا الـ exe + كلا الـ yml + تقارير الأمان
#   Job 3 — release-gate
#     ✔ يفشل إذا فشل أي job — يمنع GitHub Release
#
# أي فشل في verify:client-build أو verify:installer → exit 1 → لا إصدار
#
# ── Architecture naming ────────────────────────────────────────────────────
#   OneSoftSetup-{version}-x64.exe   → Windows 64-bit  (الأجهزة الحديثة)
#   OneSoftSetup-{version}-ia32.exe  → Windows 32-bit  (الأجهزة القديمة فقط)
#   latest.yml      → auto-update manifest للـ x64
#   latest-ia32.yml → auto-update manifest للـ ia32
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build + verify only, no GitHub Release'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      tag:
        description: 'Release tag (e.g. v1.0.2) — required when dry_run=false'
        required: false
        default: ''
        type: string

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

permissions:
  contents: write

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 1 — Security Pre-Check  (Ubuntu — fast gate)
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  security-precheck:
    name: "Security Pre-Check (21 checks)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ubuntu-pnpm-${{ hashFiles('client-app/pnpm-lock.yaml', 'server-app/pnpm-lock.yaml') }}
          restore-keys: ubuntu-pnpm-

      - name: Install client-app + server-app dependencies
        run: |
          cd client-app  && pnpm install --no-frozen-lockfile
          cd ../server-app && pnpm install --no-frozen-lockfile

      - name: Build client-app
        working-directory: client-app
        run: pnpm run build

      - name: Build server-app (CLIENT_BUILD=true)
        working-directory: server-app
        env:
          CLIENT_BUILD: 'true'
        run: pnpm run build

      - name: "verify:client-build — 21 security checks"
        run: bash scripts/verify-client-build.sh client-app/dist server-app/dist

      - name: Generate security report
        if: always()
        run: |
          mkdir -p reports
          bash scripts/generate-build-report.sh client-app/dist server-app/dist reports

      - name: Upload pre-check security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-precheck-report
          path: reports/
          retention-days: 90

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 2 — Windows Build + verify:installer
# ═══════════════════════════════════════════════════════════════════════════════
  build-windows:
    name: "Windows Build + verify:installer"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: security-precheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm store (Windows)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pnpm\store
          key: windows-pnpm-${{ hashFiles('client-app/pnpm-lock.yaml', 'server-app/pnpm-lock.yaml', 'installer/pnpm-lock.yaml') }}
          restore-keys: windows-pnpm-

      # ── تثبيت كل التبعيات ─────────────────────────────────────────────────
      - name: Install all dependencies
        shell: bash
        run: |
          cd client-app   && pnpm install --no-frozen-lockfile && cd ..
          cd server-app   && pnpm install --no-frozen-lockfile && cd ..
          cd installer    && pnpm install --no-frozen-lockfile && cd ..

      # ── بناء client-app (Vite) ─────────────────────────────────────────────
      - name: Build client-app
        working-directory: client-app
        run: pnpm run build

      # ── بناء server-app بـ CLIENT_BUILD=true (بدون licenseCenter) ──────────
      - name: Build server-app (CLIENT_BUILD=true — licenseCenter excluded)
        working-directory: server-app
        env:
          CLIENT_BUILD: 'true'
        run: pnpm run build

      # ── التحقق من bundle قبل تجميع installer ───────────────────────────────
      - name: "verify:client-build on Windows bundle"
        shell: bash
        run: bash scripts/verify-client-build.sh client-app/dist server-app/dist

      # ── نسخ dist إلى installer/resources (يتوقعها build-all.mjs) ──────────
      - name: Copy builds into installer/resources/app
        shell: bash
        run: |
          mkdir -p installer/resources/app/server-app
          # server-app dist
          cp -r server-app/dist installer/resources/app/server-app/
          # نسخ client-app dist إلى dist-ui (المسار الذي يتوقعه installer للمعالج)
          cp -r client-app/dist installer/dist-ui 2>/dev/null || true
          # نسخ client-app dist إلى resources/app/client-app/dist
          # (server-app/src/index.ts يبحث عنها هناك عبر express.static)
          mkdir -p installer/resources/app/client-app
          cp -r client-app/dist installer/resources/app/client-app/
          echo "✅ client-app/dist → resources/app/client-app/dist"
          ls installer/resources/app/client-app/dist/ | head -5

      # ── إزالة licenseCenter router من نسخة العميل (CLIENT_BUILD) ───────────
      # TypeScript يُجمِّع static imports دائماً — نستبدل licenseCenter.js بـ stub
      # خالٍ من الكود الحساس حتى يجتاز فحص verify-installer (check #4)
      - name: Stub out licenseCenter router in server-app dist (client build)
        shell: bash
        run: |
          ROUTER="installer/resources/app/server-app/dist/routers/licenseCenter.js"
          if [ -f "$ROUTER" ]; then
            # نستبدل الملف بـ stub فارغ (ESM) — الـ import في index.js يبقى يعمل
            printf '// CLIENT_BUILD stub — licenseCenter excluded from client installer\nexport const licenseCenterRouter = null;\n' > "$ROUTER"
            echo "✅ licenseCenter.js → stub (no sensitive API strings)"
          else
            echo "⚠️  $ROUTER not found — skipping stub"
          fi

      # Download nssm.exe — needed to install OneSoft-Server as a Windows Service
      - name: Download nssm.exe
        shell: pwsh
        run: |
          choco install nssm --yes --no-progress 2>&1 | Out-Null
          $dest = "installer\resources\bin\nssm.exe"
          # الملف الحقيقي في lib\nssm\tools — وليس الـ shim في bin\
          $candidates = @(
            "C:\ProgramData\chocolatey\lib\nssm\tools\nssm.exe",
            "C:\ProgramData\chocolatey\lib\nssm\tools\nssm\nssm.exe",
            "C:\ProgramData\chocolatey\bin\nssm.exe"
          )
          $src = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) {
            Write-Error "nssm.exe not found after choco install"; exit 1
          }
          Write-Host "nssm.exe source: $src"
          Copy-Item $src $dest -Force
          $size = (Get-Item $dest).Length
          Write-Host "nssm.exe ready: $size bytes"

      # ── إنشاء icon.ico مربع من icon.png ────────────────────────────────────
      # المصدر: icon.png (قد لا يكون مربعاً) → نضيف حشو شفاف للوسط
      # الأحجام المولَّدة: 256, 128, 64, 48, 32, 16 — كلها مربعة
      - name: Generate square icon.ico from icon.png
        shell: pwsh
        run: |
          # Windows runners have ImageMagick (magick) pre-installed
          $png = "installer\resources\icon.png"
          $ico = "installer\resources\icon.ico"
          # نولّد ICO مربع 256x256 بحشو شفاف لضمان عدم تشويه الشعار
          # -resize 256x256        → تصغير مع الحفاظ على النسبة
          # -gravity center        → توسيط على Canvas
          # -background transparent → حشو شفاف بدل أبيض
          # -extent 256x256        → قص Canvas للمربع الكامل
          magick "$png" -resize 256x256 -gravity center -background transparent -extent 256x256 -define icon:auto-resize="256,128,64,48,32,16" "$ico"
          Write-Host "✅ icon.ico generated — checking size and dimensions..."
          $size = (Get-Item $ico).Length
          Write-Host "   Size: $size bytes"
          if ($size -lt 1000) { Write-Error "icon.ico too small — conversion may have failed"; exit 1 }
          # التحقق أن الـ ICO مربع (أول بايتات تصف الأبعاد)
          $bytes = [System.IO.File]::ReadAllBytes($ico)
          $w = $bytes[6]; if ($w -eq 0) { $w = 256 }
          $h = $bytes[7]; if ($h -eq 0) { $h = 256 }
          Write-Host "   First image: ${w}x${h}"
          if ($w -ne $h) { Write-Error "icon.ico images are NOT square (${w}x${h}) — icon.png may not be square"; exit 1 }
          Write-Host "✅ icon.ico ready — square dimensions confirmed"

      # ── بناء Electron (main + preload + NSIS installer) ────────────────────
      - name: Build Electron installer
        working-directory: installer
        shell: bash
        env:
          CLIENT_BUILD: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # بناء electron main + preload + UI + installer
          pnpm run build

      # ── البحث عن win-unpacked (x64) ───────────────────────────────────────
      - name: Locate win-unpacked directory (x64)
        id: find-unpacked
        shell: bash
        run: |
          # electron-builder يضع النتيجة في installer/release/ حسب electron-builder.yml
          # x64 → win-unpacked/   |   ia32 → win-ia32-unpacked/
          # نبحث عن x64 صراحةً لتشغيل verify:installer على الـ architecture الأساسي
          UNPACKED=$(find installer/release -type d -name "win-unpacked" 2>/dev/null | head -1)
          if [[ -z "$UNPACKED" ]]; then
            # fallback: أي unpacked لكن نستثني ia32 صراحةً
            UNPACKED=$(find installer/release -type d -name "*unpacked*" 2>/dev/null | grep -v ia32 | head -1)
          fi
          if [[ -z "$UNPACKED" ]]; then
            echo "❌ win-unpacked (x64) not found. Directory listing:"
            find installer/release -type d 2>/dev/null | head -30 || echo "No release dir"
            exit 1
          fi
          echo "unpacked=$UNPACKED" >> $GITHUB_OUTPUT
          echo "✅ Found x64 unpacked: $UNPACKED"
          echo ""
          echo "── All unpacked directories found ──"
          find installer/release -type d -name "*unpacked*" 2>/dev/null || true

      # ── install @electron/asar لفحص app.asar ──────────────────────────────
      - name: Install asar CLI
        run: npm install -g @electron/asar

      # ── تشغيل verify:installer ────────────────────────────────────────────
      - name: "verify:installer on win-unpacked"
        shell: bash
        run: |
          UNPACKED="${{ steps.find-unpacked.outputs.unpacked }}"
          echo "▶ Running: bash scripts/verify-installer.sh \"$UNPACKED\""
          bash scripts/verify-installer.sh "$UNPACKED"

      # ── حفظ تقرير installer في ملف ───────────────────────────────────────
      - name: Save installer verification report
        shell: bash
        if: always()
        run: |
          mkdir -p reports
          UNPACKED="${{ steps.find-unpacked.outputs.unpacked }}"
          TIMESTAMP=$(date -u '+%Y-%m-%d_%H-%M-%S')
          REPORT="reports/INSTALLER_VERIFY_${TIMESTAMP}.txt"
          {
            echo "════════════════════════════════════════════════════════════════"
            echo "  OneSoft ERP — Installer Security Verification"
            echo "  Date   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Runner : windows-latest"
            echo "  Commit : ${{ github.sha }}"
            echo "  Ref    : ${{ github.ref }}"
            echo "  Dir    : $UNPACKED"
            echo "  Arch   : x64 (primary)"
            echo "════════════════════════════════════════════════════════════════"
            bash scripts/verify-installer.sh "$UNPACKED" 2>&1 || true
          } | tee "$REPORT"

      # ── توليد latest-ia32.yml لـ auto-update الـ ia32 ─────────────────────
      # electron-builder يولّد latest.yml للـ x64 تلقائياً
      # latest-ia32.yml نولّده يدوياً من ملف ia32.exe
      - name: Generate latest-ia32.yml
        shell: pwsh
        run: |
          $releaseDir = "installer/release"
          $ia32Exe = Get-ChildItem $releaseDir -Filter "*-ia32.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ia32Exe) {
            Write-Warning "⚠️  No ia32 exe found — skipping latest-ia32.yml"
            exit 0
          }

          $version = (Get-Content installer/package.json | ConvertFrom-Json).version
          $size    = $ia32Exe.Length
          $bytes   = [System.IO.File]::ReadAllBytes($ia32Exe.FullName)
          $sha512  = [Convert]::ToBase64String(
            [System.Security.Cryptography.SHA512]::Create().ComputeHash($bytes)
          )
          # ISO 8601 date — electron-updater expects this format
          $date    = (Get-Date -AsUTC).ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $name    = $ia32Exe.Name

          $yml = "version: $version`n" +
                 "files:`n" +
                 "  - url: $name`n" +
                 "    sha512: $sha512`n" +
                 "    size: $size`n" +
                 "path: $name`n" +
                 "sha512: $sha512`n" +
                 "releaseDate: '$date'"
          Set-Content "$releaseDir/latest-ia32.yml" $yml -Encoding UTF8
          Write-Host "✅ latest-ia32.yml generated"
          Write-Host "   File  : $name"
          Write-Host "   Size  : $size bytes"
          Write-Host "   SHA512: $($sha512.Substring(0,32))..."
          Get-Content "$releaseDir/latest-ia32.yml"

      # ── رفع الـ artifacts ─────────────────────────────────────────────────
      - name: "Upload: installers (x64 + ia32)"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-exe
          path: |
            installer/release/*-x64.exe
            installer/release/*-ia32.exe
            installer/release/*.blockmap
            installer/release/latest.yml
            installer/release/latest-ia32.yml
          retention-days: 90
          if-no-files-found: warn

      - name: "Upload: win-unpacked x64 (for manual inspection)"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-unpacked-x64
          path: ${{ steps.find-unpacked.outputs.unpacked }}
          retention-days: 30

      - name: "Upload: installer security report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-security-report
          path: reports/
          retention-days: 90

      # ── GitHub Release ─────────────────────────────────────────────────────
      # يُشغَّل في حالتين:
      #   A. push tag:           github.ref = refs/tags/v*   (تلقائي)
      #   B. workflow_dispatch:  dry_run=false + tag=v1.0.2  (يدوي)
      - name: Create GitHub Release
        if: >
          (startsWith(github.ref, 'refs/tags/v') ||
           (github.event.inputs.dry_run == 'false' && github.event.inputs.tag != '')) &&
          github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/release/*-x64.exe
            installer/release/*-ia32.exe
            installer/release/latest.yml
            installer/release/latest-ia32.yml
            reports/*.txt
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "OneSoft ERP ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            ## OneSoft ERP ${{ github.event.inputs.tag || github.ref_name }}

            ### تحميل الإصدار — اختر النسخة المناسبة لجهازك

            | الملف | الاستخدام |
            |-------|-----------|
            | `OneSoftSetup-*-x64.exe` | **Windows 64-bit** — الأجهزة الحديثة (موصى به) |
            | `OneSoftSetup-*-ia32.exe` | Windows 32-bit — الأجهزة القديمة فقط |

            > **كيف أعرف نسخة Windows؟**
            > ابحث في جهازك: `winver` أو اذهب إلى إعدادات → نظام → حول → نوع النظام

            ---

            ### نتيجة الفحص الأمني
            ✅ **verify:client-build** — 21/21 اختبار نجح (Ubuntu)
            ✅ **verify:client-build** — 21/21 اختبار نجح (Windows)
            ✅ **verify:installer** — win-unpacked x64 نظيف تماماً

            ### ضمانات نسخة العميل
            | المكوّن | الحكم |
            |---------|-------|
            | `license-center-app` | ❌ غير موجود في installer |
            | `/license-center` route | ❌ غير موجود في bundle |
            | `licenseCenter` router | ❌ غير موجود (CLIENT_BUILD=true) |
            | Private Key | ❌ غير موجود في أي ملف |
            | License issuance APIs | ❌ غير موجودة |
            | `/cfg/license` | ✅ موجود للتفعيل |

            انظر `installer-security-report` في الـ artifacts للتقرير الكامل.
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 3 — Release Gate (حارس نهائي)
# ═══════════════════════════════════════════════════════════════════════════════
  release-gate:
    name: "Release Security Gate"
    runs-on: ubuntu-latest
    needs: [security-precheck, build-windows]
    if: always()

    steps:
      - name: Evaluate all security jobs
        run: |
          echo "══════════════════════════════════════════════"
          echo "  OneSoft ERP — Release Gate Summary"
          echo "══════════════════════════════════════════════"
          echo "  security-precheck : ${{ needs.security-precheck.result }}"
          echo "  build-windows     : ${{ needs.build-windows.result }}"
          echo ""

          FAIL=0

          if [[ "${{ needs.security-precheck.result }}" != "success" ]]; then
            echo "❌ BLOCKED: security-precheck failed"
            echo "   → verify:client-build لم ينجح على source/bundle"
            echo "   → لا يُسمح بإصدار installer"
            FAIL=1
          else
            echo "✅ security-precheck: 21/21 checks passed"
          fi

          if [[ "${{ needs.build-windows.result }}" == "failure" ]]; then
            echo "❌ BLOCKED: Windows build or verify:installer failed"
            echo "   → الـ installer لم يُبنَ أو فشل الفحص الأمني"
            FAIL=1
          elif [[ "${{ needs.build-windows.result }}" == "success" ]]; then
            echo "✅ build-windows: installer built + verify:installer passed"
          fi

          echo ""
          if [[ "$FAIL" -eq 1 ]]; then
            echo "══════════════════════════════════════════════"
            echo "  ❌ RELEASE BLOCKED — Do NOT distribute"
            echo "══════════════════════════════════════════════"
            exit 1
          fi

          echo "══════════════════════════════════════════════"
          echo "  ✅ RELEASE CERTIFIED SECURE"
          echo "     No licenseCenter, No private key,"
          echo "     No /license-center, No issuance API"
          echo "══════════════════════════════════════════════"

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 4 — Auto-update update-manifest.json + changelog.json
# يُشغَّل بعد نجاح build-windows ويحدّث الـ manifest في main branch تلقائياً
# ═══════════════════════════════════════════════════════════════════════════════
  update-manifest:
    name: "Auto-update manifest + changelog"
    runs-on: ubuntu-latest
    needs: build-windows
    if: >
      needs.build-windows.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event.inputs.dry_run == 'false' && github.event.inputs.tag != '')) &&
      github.event.inputs.dry_run != 'true'

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Fetch release assets and update manifest
        env:
          GH_TOKEN:   ${{ secrets.GH_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
          INPUT_TAG:  ${{ github.event.inputs.tag }}
          REPO:       ${{ github.repository }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          VERSION="${TAG#v}"
          echo "── Processing release: tag=$TAG  version=$VERSION ──"

          # ── انتظر حتى تظهر الـ assets في GitHub API (قد تتأخر بضع ثوانٍ) ──
          for i in 1 2 3 4 5; do
            RELEASE=$(curl -sfH "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG" || echo '{}')
            ASSET_COUNT=$(echo "$RELEASE" | node -e \
              "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); \
               console.log((d.assets||[]).length);")
            echo "  attempt $i — assets found: $ASSET_COUNT"
            [[ "$ASSET_COUNT" -ge 2 ]] && break
            sleep 15
          done

          # ── استخرج بيانات ملف x64.exe ──────────────────────────────────────
          DOWNLOAD_URL=$(echo "$RELEASE" | node -e \
            "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); \
             const a=(d.assets||[]).find(x=>x.name.endsWith('-x64.exe')); \
             console.log(a?.browser_download_url||'');")

          FILE_SIZE=$(echo "$RELEASE" | node -e \
            "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); \
             const a=(d.assets||[]).find(x=>x.name.endsWith('-x64.exe')); \
             console.log(a?.size||0);")

          PUBLISHED_AT=$(echo "$RELEASE" | node -e \
            "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); \
             console.log(d.published_at||new Date().toISOString());")

          # ── استخرج SHA512 من latest.yml ─────────────────────────────────────
          LATEST_YML_URL=$(echo "$RELEASE" | node -e \
            "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); \
             const a=(d.assets||[]).find(x=>x.name==='latest.yml'); \
             console.log(a?.browser_download_url||'');")

          SHA512=""
          if [[ -n "$LATEST_YML_URL" ]]; then
            curl -sfLH "Authorization: Bearer $GH_TOKEN" "$LATEST_YML_URL" -o /tmp/latest.yml || true
            # الـ SHA512 في latest.yml يكون إما تحت files[].sha512 أو sha512: مباشرة
            # نأخذ السطر الذي يطابق اسم ملف x64 ثم السطر التالي
            SHA512=$(python3 - <<'PYEOF'
import re, sys
with open('/tmp/latest.yml') as f:
    content = f.read()
# Try to extract sha512 from the x64 file entry
m = re.search(r'url: [^\n]*-x64\.exe\n\s+sha512: ([^\n]+)', content)
if m:
    print(m.group(1).strip())
    sys.exit(0)
# Fallback: top-level sha512
m = re.search(r'^sha512: ([^\n]+)', content, re.MULTILINE)
if m:
    print(m.group(1).strip())
PYEOF
)
          fi

          echo "  VERSION     : $VERSION"
          echo "  DOWNLOAD_URL: $DOWNLOAD_URL"
          echo "  FILE_SIZE   : $FILE_SIZE"
          echo "  SHA512      : ${SHA512:0:40}..."
          echo "  PUBLISHED_AT: $PUBLISHED_AT"

          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "❌ لم يُعثر على x64.exe في الـ release — تأكد من نجاح build-windows"
            exit 1
          fi

          # ── حدّث update-manifest.json ────────────────────────────────────────
          node -e "
            const fs = require('fs');
            const m  = JSON.parse(fs.readFileSync('update-manifest.json', 'utf8'));
            m.latestVersion  = '$VERSION';
            m.version        = '$VERSION';
            m.downloadUrl    = '$DOWNLOAD_URL';
            m.fileSizeBytes  = $FILE_SIZE;
            if ('$SHA512') m.sha512 = '$SHA512';
            m.publishedAt    = '$PUBLISHED_AT';
            m.releaseDate    = '$PUBLISHED_AT'.slice(0,10);
            fs.writeFileSync('update-manifest.json', JSON.stringify(m, null, 2) + '\n');
            console.log('✅ update-manifest.json updated');
          "

          # ── أضف إدخالاً جديداً في changelog.json إن لم يكن موجوداً ─────────
          node -e "
            const fs = require('fs');
            const path = require('path');
            const clPath = 'changelog.json';
            let entries = [];
            if (fs.existsSync(clPath)) {
              try { entries = JSON.parse(fs.readFileSync(clPath, 'utf8')); } catch {}
            }
            const exists = entries.some(e => e.version === '$VERSION');
            if (!exists) {
              entries.unshift({
                version: '$VERSION',
                date:    '$PUBLISHED_AT'.slice(0,10),
                type:    'patch',
                title:   'الإصدار $VERSION',
                changes: [
                  { category: 'improved', text: 'تحسينات عامة في الأداء والاستقرار' }
                ]
              });
              fs.writeFileSync(clPath, JSON.stringify(entries, null, 2) + '\n');
              console.log('✅ changelog.json — added v$VERSION');
            } else {
              console.log('ℹ changelog.json — v$VERSION already exists, skipping');
            }
          "

          cat update-manifest.json

      - name: Commit and push updated files
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add update-manifest.json changelog.json
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
          else
            TAG="${{ github.event.inputs.tag || github.ref_name }}"
            git commit -m "chore: auto-update manifest → ${TAG#v} [skip ci]"
            git push origin main
            echo "✅ Committed and pushed update-manifest.json + changelog.json"
          fi
