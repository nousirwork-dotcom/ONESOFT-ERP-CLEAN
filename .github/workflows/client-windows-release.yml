name: Client Windows Release — Security Verified

# ─────────────────────────────────────────────────────────────────────────────
# Pipeline الإصدار الرسمي لنسخة العميل على Windows
#
# الخطوات بالترتيب:
#   Job 1 — security-precheck  (Ubuntu — سريع)
#     ✔ verify:client-build — 21 اختبار على source + bundle
#   Job 2 — build-windows  (Windows — يعتمد على نجاح Job 1)
#     ✔ بناء installer/resources بـ CLIENT_BUILD=true
#     ✔ بناء Electron installer x64 + ia32 (NSIS)
#     ✔ توليد latest.yml (x64) و latest-ia32.yml (ia32)
#     ✔ verify:installer على win-unpacked (x64)
#     ✔ رفع artifacts: كلا الـ exe + كلا الـ yml + تقارير الأمان
#   Job 3 — windows-acceptance
#     ✔ clean + stale-ledger على نفس artifact x64 الذي خرج من Job 2
#   Job 4 — release
#     ✔ ينشر فقط بعد نجاح Windows acceptance بالكامل
#   Job 5 — release-gate
#     ✔ يفشل إذا فشل أي job — يمنع GitHub Release
#
# أي فشل في verify:client-build أو verify:installer → exit 1 → لا إصدار
#
# ── Architecture naming ────────────────────────────────────────────────────
#   OneSoftSetup-{version}-x64.exe   → Windows 64-bit  (الأجهزة الحديثة)
#   OneSoftSetup-{version}-ia32.exe  → Windows 32-bit  (الأجهزة القديمة فقط)
#   latest.yml      → auto-update manifest للـ x64
#   latest-ia32.yml → auto-update manifest للـ ia32
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build + verify only, no GitHub Release'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      tag:
        description: 'Release tag (e.g. v1.0.41) — required when dry_run=false'
        required: false
        default: ''
        type: string
      source_run_id:
        description: 'Reuse installer artifact from this Run ID (skips build). Leave empty to build fresh.'
        required: false
        default: ''
        type: string

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

permissions:
  contents: write

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 1 — Security Pre-Check  (Ubuntu — fast gate)
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  security-precheck:
    name: "Security Pre-Check (21 checks)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ubuntu-pnpm-${{ hashFiles('client-app/pnpm-lock.yaml', 'server-app/pnpm-lock.yaml') }}
          restore-keys: ubuntu-pnpm-

      - name: Install client-app + server-app dependencies
        run: |
          cd client-app  && pnpm install --no-frozen-lockfile
          cd ../server-app && pnpm install --no-frozen-lockfile

      - name: Build client-app
        working-directory: client-app
        run: pnpm run build

      - name: Build server-app (CLIENT_BUILD=true)
        working-directory: server-app
        env:
          CLIENT_BUILD: 'true'
        run: pnpm run build

      - name: "verify:client-build — 21 security checks"
        run: bash scripts/verify-client-build.sh client-app/dist server-app/dist

      - name: Generate security report
        if: always()
        run: |
          mkdir -p reports
          bash scripts/generate-build-report.sh client-app/dist server-app/dist reports

      - name: Upload pre-check security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-precheck-report
          path: reports/
          retention-days: 90

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 2 — Windows Build + verify:installer
# ═══════════════════════════════════════════════════════════════════════════════
  build-windows:
    name: "Windows Build + verify:installer"
    runs-on: windows-latest
    timeout-minutes: 60
    needs: security-precheck
    if: >
      needs.security-precheck.result == 'success' &&
      (github.event.inputs.source_run_id == '' || github.event.inputs.source_run_id == null)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Cache pnpm store (Windows)
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pnpm\store
          key: windows-pnpm-${{ hashFiles('client-app/pnpm-lock.yaml', 'server-app/pnpm-lock.yaml', 'installer/pnpm-lock.yaml') }}
          restore-keys: windows-pnpm-

      # ── تثبيت كل التبعيات ─────────────────────────────────────────────────
      - name: Install all dependencies
        shell: bash
        run: |
          cd client-app   && pnpm install --no-frozen-lockfile && cd ..
          cd server-app   && pnpm install --no-frozen-lockfile && cd ..
          cd installer    && pnpm install --no-frozen-lockfile && cd ..

      # ── بناء client-app (Vite) ─────────────────────────────────────────────
      - name: Build client-app
        working-directory: client-app
        run: pnpm run build

      # ── بناء server-app بـ CLIENT_BUILD=true (بدون licenseCenter) ──────────
      - name: Build server-app (CLIENT_BUILD=true — licenseCenter excluded)
        working-directory: server-app
        env:
          CLIENT_BUILD: 'true'
        run: pnpm run build

      # ── التحقق من bundle قبل تجميع installer ───────────────────────────────
      - name: "verify:client-build on Windows bundle"
        shell: bash
        run: bash scripts/verify-client-build.sh client-app/dist server-app/dist

      # ── نسخ dist إلى installer/resources (يتوقعها build-all.mjs) ──────────
      - name: Copy builds into installer/resources/app
        shell: bash
        run: |
          mkdir -p installer/resources/app/server-app
          # server-app dist
          cp -r server-app/dist installer/resources/app/server-app/
          # نسخ client-app dist إلى dist-ui (المسار الذي يتوقعه installer للمعالج)
          cp -r client-app/dist installer/dist-ui 2>/dev/null || true
          # نسخ client-app dist إلى resources/app/client-app/dist
          # (server-app/src/index.ts يبحث عنها هناك عبر express.static)
          mkdir -p installer/resources/app/client-app
          cp -r client-app/dist installer/resources/app/client-app/
          echo "✅ client-app/dist → resources/app/client-app/dist"
          ls installer/resources/app/client-app/dist/ | head -5

      # ── إزالة licenseCenter router من نسخة العميل (CLIENT_BUILD) ───────────
      # TypeScript يُجمِّع static imports دائماً — نستبدل licenseCenter.js بـ stub
      # خالٍ من الكود الحساس حتى يجتاز فحص verify-installer (check #4)
      - name: Stub out licenseCenter router in server-app dist (client build)
        shell: bash
        run: |
          ROUTER="installer/resources/app/server-app/dist/routers/licenseCenter.js"
          if [ -f "$ROUTER" ]; then
            # نستبدل الملف بـ stub فارغ (ESM) — الـ import في index.js يبقى يعمل
            printf '// CLIENT_BUILD stub — licenseCenter excluded from client installer\nexport const licenseCenterRouter = null;\n' > "$ROUTER"
            echo "✅ licenseCenter.js → stub (no sensitive API strings)"
          else
            echo "⚠️  $ROUTER not found — skipping stub"
          fi

      # Download nssm.exe — needed to install OneSoft-Server as a Windows Service
      - name: Download nssm.exe
        shell: pwsh
        run: |
          choco install nssm --yes --no-progress 2>&1 | Out-Null
          $dest = "installer\resources\bin\nssm.exe"
          # الملف الحقيقي في lib\nssm\tools — وليس الـ shim في bin\
          $candidates = @(
            "C:\ProgramData\chocolatey\lib\nssm\tools\nssm.exe",
            "C:\ProgramData\chocolatey\lib\nssm\tools\nssm\nssm.exe",
            "C:\ProgramData\chocolatey\bin\nssm.exe"
          )
          $src = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) {
            Write-Error "nssm.exe not found after choco install"; exit 1
          }
          Write-Host "nssm.exe source: $src"
          Copy-Item $src $dest -Force
          $size = (Get-Item $dest).Length
          Write-Host "nssm.exe ready: $size bytes"

      # ── إنشاء icon.ico مربع من icon.png ────────────────────────────────────
      # المصدر: icon.png (قد لا يكون مربعاً) → نضيف حشو شفاف للوسط
      # الأحجام المولَّدة: 256, 128, 64, 48, 32, 16 — كلها مربعة
      - name: Generate square icon.ico from icon.png
        shell: pwsh
        run: |
          # Windows runners have ImageMagick (magick) pre-installed
          $png = "installer\resources\icon.png"
          $ico = "installer\resources\icon.ico"
          # نولّد ICO مربع 256x256 بحشو شفاف لضمان عدم تشويه الشعار
          # -resize 256x256        → تصغير مع الحفاظ على النسبة
          # -gravity center        → توسيط على Canvas
          # -background transparent → حشو شفاف بدل أبيض
          # -extent 256x256        → قص Canvas للمربع الكامل
          magick "$png" -resize 256x256 -gravity center -background transparent -extent 256x256 -define icon:auto-resize="256,128,64,48,32,16" "$ico"
          Write-Host "✅ icon.ico generated — checking size and dimensions..."
          $size = (Get-Item $ico).Length
          Write-Host "   Size: $size bytes"
          if ($size -lt 1000) { Write-Error "icon.ico too small — conversion may have failed"; exit 1 }
          # التحقق أن الـ ICO مربع (أول بايتات تصف الأبعاد)
          $bytes = [System.IO.File]::ReadAllBytes($ico)
          $w = $bytes[6]; if ($w -eq 0) { $w = 256 }
          $h = $bytes[7]; if ($h -eq 0) { $h = 256 }
          Write-Host "   First image: ${w}x${h}"
          if ($w -ne $h) { Write-Error "icon.ico images are NOT square (${w}x${h}) — icon.png may not be square"; exit 1 }
          Write-Host "✅ icon.ico ready — square dimensions confirmed"

      # ── مزامنة الإصدار من اسم الـ Tag → package.json + electron-builder.yml ──
      # electron-builder يقرأ الإصدار من package.json، لذا نضمن تطابقه مع الـ Tag
      # يمنع تكرار مشكلة v1.0.9 (Tag=1.0.9 لكن exe=1.0.8)
      - name: Sync version from git tag
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.TAG || "";
            const m = tag.match(/^v(\d+\.\d+\.\d+.*)$/);
            if (!m) {
              const p = JSON.parse(fs.readFileSync("installer/package.json","utf8"));
              console.log("⚠️  Tag \"" + tag + "\" does not match v*.*.* — using package.json version: " + p.version);
              process.exit(0);
            }
            const v = m[1];
            console.log("── Syncing version: tag=" + tag + " → version=" + v + " ──");
            const pkg = JSON.parse(fs.readFileSync("installer/package.json","utf8"));
            const old = pkg.version; pkg.version = v;
            fs.writeFileSync("installer/package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("  ✅ installer/package.json: " + old + " → " + v);
            let yml = fs.readFileSync("installer/electron-builder.yml","utf8");
            yml = yml.replace(/(extraMetadata:\s*\n\s*version:\s*")[^"]+(")/, (mm,a,b)=>a+v+b);
            if (yml.indexOf("version: \"" + v + "\"") === -1) {
              console.error("❌ electron-builder.yml still missing version \"" + v + "\" after sync — regex did not match, aborting to avoid version drift");
              process.exit(1);
            }
            fs.writeFileSync("installer/electron-builder.yml", yml);
            console.log("  ✅ electron-builder.yml extraMetadata.version → " + v);
          '

      # ── فحص تطابق الإصدار قبل البناء (يفشل CI عند عدم التطابق) ─────────────
      - name: Verify version consistency before build
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const tag = (process.env.TAG || "").replace(/^v/, "");
            const pkg = JSON.parse(fs.readFileSync("installer/package.json","utf8")).version;
            const yml = fs.readFileSync("installer/electron-builder.yml","utf8");
            const m = yml.match(/extraMetadata:\s*\n\s*version:\s*"([^"]+)"/);
            const eb = m ? m[1] : "NOT_FOUND";
            console.log("  Git Tag                : " + (process.env.TAG || ""));
            console.log("  installer/package.json : " + pkg);
            console.log("  electron-builder.yml   : " + eb);
            let fail = false;
            const isVer = /^\d+\.\d+\.\d+/.test(tag);
            if (isVer && pkg !== tag) { console.error("❌ MISMATCH: package.json (" + pkg + ") ≠ tag (" + tag + ")"); fail = true; }
            if (isVer && eb  !== tag) { console.error("❌ MISMATCH: electron-builder.yml (" + eb + ") ≠ tag (" + tag + ")"); fail = true; }
            if (pkg !== eb) { console.error("❌ MISMATCH: package.json (" + pkg + ") ≠ electron-builder.yml (" + eb + ")"); fail = true; }
            if (fail) {
              console.error("══════════════════════════════════════════════");
              console.error("  ❌ BUILD BLOCKED — version sources inconsistent");
              console.error("══════════════════════════════════════════════");
              process.exit(1);
            }
            console.log("✅ All version sources consistent: " + pkg);
          '

      # ── بناء Electron (main + preload + NSIS installer) ────────────────────
      - name: Build Electron installer
        working-directory: installer
        shell: bash
        env:
          CLIENT_BUILD: 'true'
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # بناء electron main + preload + UI + installer
          pnpm run build

      # ── Defender Gate: أحدث signatures + فحص كل ملفات Windows القابلة للتشغيل ─
      # لا نستخدم Allow/Restore أو DisableRemediation. أي Detection أو فشل في
      # الفحص يوقف job، وبالتالي لا يصل Create GitHub Release إلى النشر.
      - name: Microsoft Defender scan — release gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mp = Get-ChildItem 'C:\ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $mp) {
            Write-Error "MpCmdRun.exe not found — Defender gate cannot run"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path reports | Out-Null
          $report = 'reports/DEFENDER_RELEASE_GATE.txt'
          "Runner: windows-latest" | Set-Content $report -Encoding utf8
          "MpCmdRun: $($mp.FullName)" | Add-Content $report -Encoding utf8

          & $mp.FullName -SignatureUpdate 2>&1 | Tee-Object -FilePath $report -Append
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Microsoft Defender signature update failed"
            exit 1
          }

          $targets = @()
          $targets += @(Get-ChildItem installer/release -Filter '*-x64.exe' -File -ErrorAction SilentlyContinue)
          $targets += @(Get-ChildItem installer/release -Filter '*-ia32.exe' -File -ErrorAction SilentlyContinue)
          $targets += @(Get-ChildItem installer/release -Recurse -Filter 'OneSoft ERP.exe' -File -ErrorAction SilentlyContinue)
          if ($targets.Count -lt 3) {
            Write-Error "Expected x64 installer, ia32 installer, and OneSoft ERP.exe for Defender scan"
            exit 1
          }
          $failed = $false
          foreach ($target in $targets) {
            Write-Host "Defender scanning: $($target.FullName)"
            "SCAN_FILE=$($target.FullName)" | Add-Content $report -Encoding utf8
            $scanOutput = & $mp.FullName -Scan -ScanType 3 -File $target.FullName 2>&1
            $scanExitCode = $LASTEXITCODE
            $scanText = ($scanOutput -join "`n")
            $scanText | Add-Content $report -Encoding utf8
            "SCAN_EXIT_CODE=$scanExitCode" | Add-Content $report -Encoding utf8
            # MpCmdRun normally returns non-zero for a detected threat. Also
            # match positive detection wording, excluding "found no threats".
            $positiveDetection = $scanText -match '(?i)(Wacatac|malware\s+found|threats?\s+found|found\s+\d+\s+threat|detected\s+threat)'
            if ($scanExitCode -ne 0 -or $positiveDetection -or -not (Test-Path $target.FullName)) {
              Write-Error "Microsoft Defender detected or removed: $($target.FullName)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          "RESULT=PASS" | Add-Content $report -Encoding utf8
          Write-Host "✅ Microsoft Defender release gate passed"

      # ── فحص أسماء ملفات EXE الناتجة تطابق الـ Tag (يفشل CI عند عدم التطابق) ──
      - name: Verify EXE names match tag version
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            EXPECTED_X64="OneSoftSetup-${VERSION}-x64.exe"
            EXPECTED_IA32="OneSoftSetup-${VERSION}-ia32.exe"
            echo "── Checking EXE names for version $VERSION ──"
            echo "  Expected x64 : $EXPECTED_X64"
            echo "  Expected ia32: $EXPECTED_IA32"
            echo "  EXE files found in installer/release:"
            find installer/release -name "*.exe" 2>/dev/null | sort | sed 's/^/    /'
            X64_FOUND=$(find installer/release -name "$EXPECTED_X64" 2>/dev/null | head -1)
            IA32_FOUND=$(find installer/release -name "$EXPECTED_IA32" 2>/dev/null | head -1)
            FAIL=0
            if [[ -z "$X64_FOUND" ]]; then echo "❌ MISSING: $EXPECTED_X64"; FAIL=1; fi
            if [[ -z "$IA32_FOUND" ]]; then echo "❌ MISSING: $EXPECTED_IA32"; FAIL=1; fi
            if [[ "$FAIL" -eq 1 ]]; then
              echo "══════════════════════════════════════════════"
              echo "  ❌ RELEASE BLOCKED — EXE names ≠ tag version"
              echo "══════════════════════════════════════════════"
              exit 1
            fi
            echo "✅ EXE names match tag version $VERSION"
          else
            echo "ℹ️  Non-version tag — skipping EXE name check"
          fi

      # ── البحث عن win-unpacked (x64) ───────────────────────────────────────
      - name: Locate win-unpacked directory (x64)
        id: find-unpacked
        shell: bash
        run: |
          # electron-builder يضع النتيجة في installer/release/ حسب electron-builder.yml
          # x64 → win-unpacked/   |   ia32 → win-ia32-unpacked/
          # نبحث عن x64 صراحةً لتشغيل verify:installer على الـ architecture الأساسي
          UNPACKED=$(find installer/release -type d -name "win-unpacked" 2>/dev/null | head -1)
          if [[ -z "$UNPACKED" ]]; then
            # fallback: أي unpacked لكن نستثني ia32 صراحةً
            UNPACKED=$(find installer/release -type d -name "*unpacked*" 2>/dev/null | grep -v ia32 | head -1)
          fi
          if [[ -z "$UNPACKED" ]]; then
            echo "❌ win-unpacked (x64) not found. Directory listing:"
            find installer/release -type d 2>/dev/null | head -30 || echo "No release dir"
            exit 1
          fi
          echo "unpacked=$UNPACKED" >> $GITHUB_OUTPUT
          echo "✅ Found x64 unpacked: $UNPACKED"
          echo ""
          echo "── All unpacked directories found ──"
          find installer/release -type d -name "*unpacked*" 2>/dev/null || true

      # ── install @electron/asar لفحص app.asar ──────────────────────────────
      - name: Install asar CLI
        run: npm install -g @electron/asar

      # ── تشغيل verify:installer ────────────────────────────────────────────
      - name: "verify:installer on win-unpacked"
        shell: bash
        run: |
          UNPACKED="${{ steps.find-unpacked.outputs.unpacked }}"
          echo "▶ Running: bash scripts/verify-installer.sh \"$UNPACKED\""
          bash scripts/verify-installer.sh "$UNPACKED"

      # ── حفظ تقرير installer في ملف ───────────────────────────────────────
      - name: Save installer verification report
        shell: bash
        if: always()
        run: |
          mkdir -p reports
          UNPACKED="${{ steps.find-unpacked.outputs.unpacked }}"
          TIMESTAMP=$(date -u '+%Y-%m-%d_%H-%M-%S')
          REPORT="reports/INSTALLER_VERIFY_${TIMESTAMP}.txt"
          {
            echo "════════════════════════════════════════════════════════════════"
            echo "  OneSoft ERP — Installer Security Verification"
            echo "  Date   : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "  Runner : windows-latest"
            echo "  Commit : ${{ github.sha }}"
            echo "  Ref    : ${{ github.ref }}"
            echo "  Dir    : $UNPACKED"
            echo "  Arch   : x64 (primary)"
            echo "════════════════════════════════════════════════════════════════"
            bash scripts/verify-installer.sh "$UNPACKED" 2>&1 || true
          } | tee "$REPORT"

      # ── توليد metadata صريحة للـ auto-update حسب المعمارية ────────────────
      # لا نعتمد على latest.yml الذي قد يولده electron-builder عند وجود أكثر
      # من target؛ نعيد توليده من ملف x64 المنشور فعلياً حتى لا يشير path
      # إلى artifact غير مرفوع.
      - name: Generate latest.yml (x64)
        shell: pwsh
        run: |
          $releaseDir = "installer/release"
          $x64Exe = Get-ChildItem $releaseDir -Filter "*-x64.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $x64Exe) {
            Write-Error "❌ No x64 exe found — latest.yml cannot be generated"
            exit 1
          }

          $version = (Get-Content installer/package.json | ConvertFrom-Json).version
          $size    = $x64Exe.Length
          $bytes   = [System.IO.File]::ReadAllBytes($x64Exe.FullName)
          $sha512  = [Convert]::ToBase64String(
            [System.Security.Cryptography.SHA512]::Create().ComputeHash($bytes)
          )
          $date    = (Get-Date -AsUTC).ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $name    = $x64Exe.Name

          $yml = "version: $version`n" +
                 "files:`n" +
                 "  - url: $name`n" +
                 "    sha512: $sha512`n" +
                 "    size: $size`n" +
                 "path: $name`n" +
                 "sha512: $sha512`n" +
                 "releaseDate: '$date'"
          Set-Content "$releaseDir/latest.yml" $yml -Encoding UTF8
          Write-Host "✅ latest.yml generated from x64 installer"
          Write-Host "   File  : $name"
          Write-Host "   Size  : $size bytes"
          Write-Host "   SHA512: $($sha512.Substring(0,32))..."
          Get-Content "$releaseDir/latest.yml"

      # latest-ia32.yml نولّده يدوياً من ملف ia32.exe
      - name: Generate latest-ia32.yml
        shell: pwsh
        run: |
          $releaseDir = "installer/release"
          $ia32Exe = Get-ChildItem $releaseDir -Filter "*-ia32.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $ia32Exe) {
            Write-Warning "⚠️  No ia32 exe found — skipping latest-ia32.yml"
            exit 0
          }

          $version = (Get-Content installer/package.json | ConvertFrom-Json).version
          $size    = $ia32Exe.Length
          $bytes   = [System.IO.File]::ReadAllBytes($ia32Exe.FullName)
          $sha512  = [Convert]::ToBase64String(
            [System.Security.Cryptography.SHA512]::Create().ComputeHash($bytes)
          )
          # ISO 8601 date — electron-updater expects this format
          $date    = (Get-Date -AsUTC).ToString("yyyy-MM-ddTHH:mm:ss.fffZ")
          $name    = $ia32Exe.Name

          $yml = "version: $version`n" +
                 "files:`n" +
                 "  - url: $name`n" +
                 "    sha512: $sha512`n" +
                 "    size: $size`n" +
                 "path: $name`n" +
                 "sha512: $sha512`n" +
                 "releaseDate: '$date'"
          Set-Content "$releaseDir/latest-ia32.yml" $yml -Encoding UTF8
          Write-Host "✅ latest-ia32.yml generated"
          Write-Host "   File  : $name"
          Write-Host "   Size  : $size bytes"
          Write-Host "   SHA512: $($sha512.Substring(0,32))..."
          Get-Content "$releaseDir/latest-ia32.yml"

      # ── تثبيت هوية الـ Candidate قبل الاختبارات ────────────────────────────
      # هذا manifest يرافق نفس الملفات التي ستستخدمها acceptance ثم تنشرها
      # release job. لا يوجد build ثانٍ أو إعادة توليد للـ EXE بعد هذه النقطة.
      - name: Write candidate build manifest and SHA256
        shell: pwsh
        run: |
          $releaseDir = "installer/release"
          $version = (Get-Content installer/package.json | ConvertFrom-Json).version
          $x64Exe = Get-ChildItem $releaseDir -Filter "*-x64.exe" -File | Select-Object -First 1
          $ia32Exe = Get-ChildItem $releaseDir -Filter "*-ia32.exe" -File | Select-Object -First 1
          if (-not $x64Exe) { throw "x64 installer is missing; cannot certify candidate" }
          if (-not $ia32Exe) { throw "ia32 installer is missing; cannot certify candidate" }

          $manifest = [ordered]@{
            product = "OneSoft ERP"
            version = $version
            commit = "${{ github.sha }}"
            built_at_utc = (Get-Date -AsUTC).ToString("o")
            x64 = [ordered]@{
              file = $x64Exe.Name
              size = $x64Exe.Length
              sha256 = (Get-FileHash $x64Exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            ia32 = [ordered]@{
              file = $ia32Exe.Name
              size = $ia32Exe.Length
              sha256 = (Get-FileHash $ia32Exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content "$releaseDir/build-manifest.json" -Encoding UTF8
          Write-Host "Candidate build manifest:"
          Get-Content "$releaseDir/build-manifest.json"

      # ── رفع الـ artifacts ─────────────────────────────────────────────────
      - name: "Upload: installers (x64 + ia32)"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-exe
          path: |
            installer/release/*-x64.exe
            installer/release/*-ia32.exe
            installer/release/*.blockmap
            installer/release/latest.yml
            installer/release/latest-ia32.yml
            installer/release/build-manifest.json
          retention-days: 90
          if-no-files-found: warn

      - name: "Upload: win-unpacked x64 (for manual inspection)"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-unpacked-x64
          path: ${{ steps.find-unpacked.outputs.unpacked }}
          retention-days: 30

      - name: "Upload: installer security report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-security-report
          path: reports/
          retention-days: 90

      # ── GitHub Release ─────────────────────────────────────────────────────
      # يُشغَّل في حالتين:
      #   A. push tag:           github.ref = refs/tags/v*   (تلقائي)
      #   B. workflow_dispatch:  dry_run=false + tag=v1.0.2  (يدوي)
      - name: Legacy in-build release step (disabled; release waits for acceptance)
        if: false
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/release/*-x64.exe
            installer/release/*-ia32.exe
            installer/release/latest.yml
            installer/release/latest-ia32.yml
            reports/*.txt
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "OneSoft ERP ${{ github.event.inputs.tag || github.ref_name }}"
          body: |
            ## OneSoft ERP ${{ github.event.inputs.tag || github.ref_name }}

            ### تحميل الإصدار — اختر النسخة المناسبة لجهازك

            | الملف | الاستخدام |
            |-------|-----------|
            | `OneSoftSetup-*-x64.exe` | **Windows 64-bit** — الأجهزة الحديثة (موصى به) |
            | `OneSoftSetup-*-ia32.exe` | Windows 32-bit — الأجهزة القديمة فقط |

            > **كيف أعرف نسخة Windows؟**
            > ابحث في جهازك: `winver` أو اذهب إلى إعدادات → نظام → حول → نوع النظام

            ---

            ### نتيجة الفحص الأمني
            ✅ **verify:client-build** — 21/21 اختبار نجح (Ubuntu)
            ✅ **verify:client-build** — 21/21 اختبار نجح (Windows)
            ✅ **verify:installer** — win-unpacked x64 نظيف تماماً

            ### ضمانات نسخة العميل
            | المكوّن | الحكم |
            |---------|-------|
            | `license-center-app` | ❌ غير موجود في installer |
            | `/license-center` route | ❌ غير موجود في bundle |
            | `licenseCenter` router | ❌ غير موجود (CLIENT_BUILD=true) |
            | Private Key | ❌ غير موجود في أي ملف |
            | License issuance APIs | ❌ غير موجودة |
            | `/cfg/license` | ✅ موجود للتفعيل |

            انظر `installer-security-report` في الـ artifacts للتقرير الكامل.
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 2b — Reuse installer artifact from a previous Run (skips build)
# ═══════════════════════════════════════════════════════════════════════════════
  reuse-artifact:
    name: "Reuse installer artifact from Run ${{ github.event.inputs.source_run_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: security-precheck
    if: >
      needs.security-precheck.result == 'success' &&
      github.event.inputs.source_run_id != '' &&
      github.event.inputs.source_run_id != null

    outputs:
      source_head_sha: ${{ steps.provenance.outputs.source_head_sha }}

    steps:
      - name: Validate source run provenance
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.inputs.source_run_id }}"
          REPO="${{ github.repository }}"
          EXPECTED_WORKFLOW=".github/workflows/client-windows-release.yml"

          echo "Fetching run metadata for run $RUN_ID in $REPO..."
          RUN_JSON=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID")

          RUN_WORKFLOW=$(echo "$RUN_JSON"    | jq -r '.path')
          RUN_REPO=$(echo "$RUN_JSON"        | jq -r '.repository.full_name')
          RUN_HEAD_SHA=$(echo "$RUN_JSON"    | jq -r '.head_sha')
          RUN_HEAD_BRANCH=$(echo "$RUN_JSON" | jq -r '.head_branch')

          echo "  workflow   : $RUN_WORKFLOW"
          echo "  repository : $RUN_REPO"
          echo "  head_sha   : $RUN_HEAD_SHA"
          echo "  head_branch: $RUN_HEAD_BRANCH"

          # Fetch all jobs in the source run to locate the build-windows job.
          # We check the BUILD job's conclusion, not the overall run conclusion:
          # a reuse is valid when the binary was built successfully even if
          # acceptance failed (the purpose of source_run_id is to reuse a good
          # binary after fixing the acceptance test script).
          JOBS_JSON=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")

          BUILD_CONCLUSION=$(echo "$JOBS_JSON" | jq -r '
            .jobs[]
            | select(.name | test("Windows Build"; "i"))
            | .conclusion' | head -1)

          echo "  build-windows conclusion: $BUILD_CONCLUSION"

          FAIL=0
          if [[ "$RUN_WORKFLOW" != "$EXPECTED_WORKFLOW" ]]; then
            echo "❌ PROVENANCE FAIL: workflow='$RUN_WORKFLOW' != expected '$EXPECTED_WORKFLOW'"
            FAIL=1
          fi
          if [[ "$RUN_REPO" != "$REPO" ]]; then
            echo "❌ PROVENANCE FAIL: repository='$RUN_REPO' != expected '$REPO'"
            FAIL=1
          fi
          if [[ "$BUILD_CONCLUSION" != "success" ]]; then
            echo "❌ PROVENANCE FAIL: build-windows job conclusion='$BUILD_CONCLUSION' (must be success)"
            FAIL=1
          fi
          if [[ "$RUN_HEAD_SHA" == "null" || -z "$RUN_HEAD_SHA" ]]; then
            echo "❌ PROVENANCE FAIL: could not retrieve head_sha from source run"
            FAIL=1
          fi
          if [[ "$FAIL" -eq 1 ]]; then
            exit 1
          fi

          echo "✅ Provenance validated: run=$RUN_ID build=success sha=$RUN_HEAD_SHA branch=$RUN_HEAD_BRANCH"
          echo "source_head_sha=$RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Download installer-exe from source run
        uses: actions/download-artifact@v4
        with:
          name: installer-exe
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate

      - name: Verify build-manifest.json matches source run SHA
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=$(find candidate -name build-manifest.json | head -1)
          if [ -z "$MANIFEST" ]; then
            echo "❌ build-manifest.json missing from source run artifact"
            exit 1
          fi
          echo "✅ Manifest found: $MANIFEST"
          cat "$MANIFEST"
          # Validate that the manifest's recorded commit matches the provenance-verified head SHA
          MANIFEST_COMMIT=$(jq -r '.commit' "$MANIFEST")
          SOURCE_SHA="${{ steps.provenance.outputs.source_head_sha }}"
          if [[ "$MANIFEST_COMMIT" != "$SOURCE_SHA" ]]; then
            echo "❌ INTEGRITY FAIL: manifest.commit='$MANIFEST_COMMIT' != source run head_sha='$SOURCE_SHA'"
            exit 1
          fi
          echo "✅ manifest.commit matches source run head SHA: $MANIFEST_COMMIT"

      - name: Re-upload as installer-exe for this run
        uses: actions/upload-artifact@v4
        with:
          name: installer-exe
          path: candidate/
          retention-days: 90

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 3 — Windows Acceptance على نفس Candidate artifact (بدون build)
# ═══════════════════════════════════════════════════════════════════════════════
  windows-acceptance:
    name: "Windows ${{ matrix.scenario }} — same 1.0.41 candidate"
    runs-on: windows-latest
    timeout-minutes: 90
    needs: [security-precheck, build-windows, reuse-artifact]
    if: >
      always() &&
      needs.security-precheck.result == 'success' &&
      (
        needs.build-windows.result == 'success' ||
        needs.reuse-artifact.result == 'success'
      ) &&
      (
        needs.build-windows.result  == 'success' ||
        needs.build-windows.result  == 'skipped'
      ) &&
      (
        needs.reuse-artifact.result == 'success' ||
        needs.reuse-artifact.result == 'skipped'
      )
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, stale-ledger]

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install PostgreSQL 16
        shell: pwsh
        run: |
          $installed = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "PostgreSQL Chocolatey attempt $attempt/4"
            & choco install postgresql16 --yes --no-progress --execution-timeout=1800 --params '/Password:OneSoftAcceptance2026 /Port:5432'
            $service = Get-Service -Name 'postgresql-x64-16' -ErrorAction SilentlyContinue
            if ($LASTEXITCODE -eq 0 -and $service) {
              if ($service.Status -ne 'Running') { Start-Service $service.Name }
              $installed = $true
              break
            }
            if ($attempt -lt 4) {
              Write-Warning "PostgreSQL installation attempt $attempt failed; retrying after 20 seconds."
              Start-Sleep -Seconds 20
            }
          }
          if (-not $installed) { throw 'PostgreSQL 16 service was not installed after four attempts' }

      - name: Install NSSM
        shell: pwsh
        run: |
          choco install nssm --yes --no-progress
          if (-not (Get-Command nssm.exe -ErrorAction SilentlyContinue)) { throw 'NSSM was not installed' }

      - name: Download the single built candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-exe
          path: candidate

      - name: Verify candidate manifest and SHA256
        id: candidate
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
        run: |
          $manifestPath = Get-ChildItem candidate -Filter 'build-manifest.json' -Recurse -File | Select-Object -First 1
          if (-not $manifestPath) { throw 'build-manifest.json is missing from installer-exe artifact' }
          $manifest = Get-Content -Raw $manifestPath.FullName | ConvertFrom-Json
          if ($manifest.version -ne '1.0.41') { throw "Candidate version is $($manifest.version), expected 1.0.41" }
          # Skip commit-SHA check when reusing an artifact from a different run
          if ([string]::IsNullOrEmpty($env:SOURCE_RUN_ID)) {
            if ($manifest.commit -ne '${{ github.sha }}') { throw "Candidate commit $($manifest.commit) does not match workflow commit ${{ github.sha }}" }
          } else {
            Write-Host "Reusing artifact from Run $env:SOURCE_RUN_ID — manifest commit: $($manifest.commit) (current sha: ${{ github.sha }})"
          }
          $x64 = Get-ChildItem candidate -Filter $manifest.x64.file -Recurse -File | Select-Object -First 1
          if (-not $x64) { throw "Candidate x64 file $($manifest.x64.file) is missing" }
          $actual = (Get-FileHash $x64.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.x64.sha256) {
            throw "Candidate SHA256 mismatch: actual=$actual manifest=$($manifest.x64.sha256)"
          }
          "exe=$($x64.FullName)" >> $env:GITHUB_OUTPUT
          "version=$($manifest.version)" >> $env:GITHUB_OUTPUT
          Write-Host "Using exact candidate: $($x64.FullName)"
          Write-Host "SHA256: $actual"

      - name: Run Windows trial lifecycle acceptance on the exact candidate
        shell: pwsh
        run: |
          ./scripts/windows-trial-lifecycle-acceptance.ps1 `
            -InstallerPath (Resolve-Path 'candidate\OneSoftSetup-1.0.41-x64.exe') `
            -ReportDir 'windows-trial-lifecycle-${{ matrix.scenario }}'

      - name: Upload Windows trial lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-trial-lifecycle-${{ matrix.scenario }}
          path: windows-trial-lifecycle-${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Run ${{ matrix.scenario }} acceptance against same candidate
        shell: pwsh
        run: |
          $schemaSource = Get-Content -Raw 'server-app/src/schema-version.ts'
          if ($schemaSource -notmatch "REQUIRED_SCHEMA_VERSION\s*=\s*'([^']+)'") {
            throw 'Could not resolve the canonical schema version'
          }
          $params = @{
            NewInstallerPath = '${{ steps.candidate.outputs.exe }}'
            NewVersion = '${{ steps.candidate.outputs.version }}'
            ExpectedSchemaVersion = $Matches[1]
            ReportDir = "windows-v100-v1040-${{ matrix.scenario }}"
          }
          if ('${{ matrix.scenario }}' -eq 'stale-ledger') {
            $params.ReproduceStaleLedger = $true
          }
          ./scripts/windows-v100-v1039-acceptance.ps1 @params

      - name: Upload ${{ matrix.scenario }} acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-v100-v1040-${{ matrix.scenario }}
          path: windows-v100-v1040-${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 30

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 4 — Release only after both Windows acceptance scenarios pass
# ═══════════════════════════════════════════════════════════════════════════════
  release:
    name: "Publish verified OneSoft ERP 1.0.41"
    runs-on: ubuntu-latest
    needs: [security-precheck, build-windows, reuse-artifact, windows-acceptance]
    if: >
      always() &&
      needs.windows-acceptance.result == 'success' &&
      (
        needs.build-windows.result    == 'success' ||
        needs.reuse-artifact.result   == 'success'
      ) &&
      github.event.inputs.dry_run != 'true' &&
      (
        startsWith(github.ref, 'refs/tags/v') ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry_run == 'false' &&
          github.event.inputs.tag != ''
        )
      )

    steps:
      - name: Download the exact candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: installer-exe
          path: candidate

      - name: Verify release candidate manifest
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ needs.reuse-artifact.outputs.source_head_sha }}
        run: |
          set -euo pipefail
          MANIFEST="$(find candidate -name build-manifest.json -type f | head -1)"
          test -n "$MANIFEST"
          export MANIFEST
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          function findFile(dir, name) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = `${dir}/${entry.name}`;
              if (entry.isFile() && entry.name === name) return full;
              if (entry.isDirectory()) {
                const found = findFile(full, name);
                if (found) return found;
              }
            }
            return null;
          }
          const manifest = JSON.parse(fs.readFileSync(process.env.MANIFEST, 'utf8'));
          if (manifest.version !== '1.0.41') throw new Error(`Unexpected version ${manifest.version}`);
          for (const arch of ['x64', 'ia32']) {
            const file = findFile('candidate', manifest[arch].file);
            if (!file) throw new Error(`Missing ${manifest[arch].file}`);
            const sha = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (sha !== manifest[arch].sha256) throw new Error(`SHA256 mismatch for ${file}`);
          }
          // Commit-SHA provenance: for reuse path, trust the SHA fetched via the
          // API (SOURCE_HEAD_SHA); for fresh builds it must match GITHUB_SHA.
          const sourceHeadSha = process.env.SOURCE_HEAD_SHA;
          const trustedSha    = sourceHeadSha || process.env.GITHUB_SHA;
          if (trustedSha && manifest.commit !== trustedSha) {
            throw new Error(
              `Artifact provenance mismatch: manifest.commit=${manifest.commit} ` +
              `does not match trusted SHA=${trustedSha}. ` +
              `This binary was not built from the expected source commit.`
            );
          }
          console.log(`✅ commit provenance OK: ${manifest.commit}`);
          console.log(JSON.stringify(manifest, null, 2));
          NODE

      - name: Create GitHub Release from exact tested artifact
        uses: softprops/action-gh-release@v2
        with:
          files: |
            candidate/OneSoftSetup-1.0.41-x64.exe
            candidate/OneSoftSetup-1.0.41-ia32.exe
            candidate/latest.yml
            candidate/latest-ia32.yml
            candidate/build-manifest.json
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "OneSoft ERP 1.0.41"
          body: |
            ## OneSoft ERP 1.0.41

            This release was created only after the exact candidate artifact passed
            both Windows acceptance scenarios:

            - clean: v1.0.0 → OneSoftSetup-1.0.41-x64.exe
            - stale-ledger: v1.0.0 → OneSoftSetup-1.0.41-x64.exe

            The attached `build-manifest.json` records the source commit, file
            sizes, and SHA256 values for both architectures.
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 5 — Release Gate (حارس نهائي)
# ═══════════════════════════════════════════════════════════════════════════════
  release-gate:
    name: "Release Security Gate"
    runs-on: ubuntu-latest
    needs: [security-precheck, build-windows, reuse-artifact, windows-acceptance, release]
    if: always()

    steps:
      - name: Evaluate all security jobs
        run: |
          echo "══════════════════════════════════════════════"
          echo "  OneSoft ERP — Release Gate Summary"
          echo "══════════════════════════════════════════════"
          echo "  security-precheck : ${{ needs.security-precheck.result }}"
          echo "  source_run_id     : ${{ github.event.inputs.source_run_id || 'fresh-build' }}"
          echo "  build-windows     : ${{ needs.build-windows.result }}"
          echo "  reuse-artifact    : ${{ needs.reuse-artifact.result }}"
          echo "  windows-acceptance: ${{ needs.windows-acceptance.result }}"
          echo "  release           : ${{ needs.release.result }}"
          echo ""

          FAIL=0

          SRC="${{ github.event.inputs.source_run_id }}"
          if [[ -n "$SRC" ]]; then
            echo "  ℹ️  source_run_id=$SRC — artifact reused from prior run, re-tested in this run"
          fi

          if [[ "${{ needs.security-precheck.result }}" != "success" ]]; then
            echo "❌ BLOCKED: security-precheck failed"
            echo "   → verify:client-build لم ينجح على source/bundle"
            echo "   → لا يُسمح بإصدار installer"
            FAIL=1
          else
            echo "✅ security-precheck: 21/21 checks passed"
          fi

          if [[ "${{ needs.build-windows.result }}" == "failure" ]]; then
            echo "❌ BLOCKED: Windows build or verify:installer failed"
            echo "   → الـ installer لم يُبنَ أو فشل الفحص الأمني"
            FAIL=1
          elif [[ "${{ needs.build-windows.result }}" == "success" ]]; then
            echo "✅ build-windows: installer built + verify:installer passed"
          fi

          if [[ "${{ needs.windows-acceptance.result }}" != "success" ]]; then
            echo "❌ BLOCKED: both Windows acceptance scenarios must pass"
            FAIL=1
          else
            echo "✅ windows-acceptance: clean + stale-ledger passed on same candidate"
          fi

          if [[ "${{ needs.release.result }}" == "failure" ]]; then
            echo "❌ BLOCKED: verified candidate was not published"
            FAIL=1
          elif [[ "${{ needs.release.result }}" == "success" ]]; then
            echo "✅ release: published exact tested candidate"
          fi

          echo ""
          if [[ "$FAIL" -eq 1 ]]; then
            echo "══════════════════════════════════════════════"
            echo "  ❌ RELEASE BLOCKED — Do NOT distribute"
            echo "══════════════════════════════════════════════"
            exit 1
          fi

          echo "══════════════════════════════════════════════"
          echo "  ✅ RELEASE CERTIFIED SECURE"
          echo "     No licenseCenter, No private key,"
          echo "     No /license-center, No issuance API"
          echo "══════════════════════════════════════════════"
